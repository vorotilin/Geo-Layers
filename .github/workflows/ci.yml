name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Линтер, типы, тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установить uv
        run: pip install uv==0.13.0
      - name: Зависимости (строго по uv.lock)
        run: uv sync --frozen
      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: mypy
        run: uv run mypy app
      - name: pytest
        run: uv run pytest

  gitleaks:
    name: Секреты в истории
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.0
          git /repo --redact --verbose

  docker:
    name: Docker compose
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - name: Сборка и запуск
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: /health и /ready
        run: |
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:8000/ready
      - name: Контейнер api не от root
        run: test "$(docker compose exec -T api id -u)" != "0"
      - name: Логи при падении
        if: failure()
        run: docker compose logs --no-color
      - name: Остановка
        if: always()
        run: docker compose down -v

# Для разработки: `uv run alembic revision -m "..."`, `uv run alembic upgrade head`.
# В контейнере миграции применяет `python -m app migrate` (app/migrate.py),
# строка подключения — из DATABASE_URL.
[alembic]
script_location = app/db/migrations
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s

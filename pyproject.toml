[project]
name = "apc-layers"
version = "0.1.0"
description = "Сервис гео-слоёв: сетки поставщиков и наборы точек → тайлы, значения, агрегаты"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "gunicorn>=23",
    "uvicorn-worker>=0.2",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "sqlalchemy>=2.0",
    "psycopg-pool>=3.2",
    "numpy>=2.0",
    "pyproj>=3.6",
    "morecantile>=6.0",
    "ijson>=3.3",
    "pillow>=11",
    "python-multipart>=0.0.9",
    "shapely>=2.0",
    "boto3>=1.34",
    "rasterio>=1.3",
    "h3>=4.0",
    "openpyxl>=3.1",
    "pyogrio>=0.8",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2",
    "ruff>=0.6",
    "mypy>=1.11",
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S104"]  # bind 0.0.0.0 внутри контейнера — норма

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # тестовые токены
# В f-строки SQL подставляется только константа JOB_COLUMNS, значения — параметрами.
"app/jobs/queue.py" = ["S608"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Cancel Job V1 Jobs  Job Id  Cancel Post
        '401':
          description: Нет токена или он недействителен
          content: *id001
        4XX:
          description: Ошибка запроса
          content: *id001
      security:
      - bearer: []

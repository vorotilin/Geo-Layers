openapi: 3.1.0
info:
  title: apc-layers
  version: m1-draft
  description: "Сервис гео-слоёв платформы наружной рекламы. Черновик контракта этапа M1.\n\n- Аутентификация:\
    \ `Authorization: Bearer <token>`, области `admin ⊃ write ⊃ read`.\n- Тайлы — по подписанной ссылке\
    \ из `POST /v1/tiles/sign` (подпись префикса пути, ADR-0008).\n- Долгие операции — задания: `202`\
    \ + `status_url`, затем `GET /v1/jobs/{id}`.\n- Идемпотентность: `Idempotency-Key` у `POST /v1/imports`\
    \ и дедупликация импорта\n  по sha256 файла + хэшу нормализованного манифеста.\n- Ошибки — `{error,\
    \ message, details}`; неизвестные поля игнорируются, перечисления открытые.\n"
paths:
  /health:
    get:
      tags:
      - service
      summary: Health
      description: Процесс жив. Зависимости не проверяет.
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
        4XX:
          description: Ошибка запроса
          content: &id001
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /ready:
    get:
      tags:
      - service
      summary: Ready
      description: 'Готов принимать запросы: все зависимости доступны.'
      operationId: ready_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        4XX:
          description: Ошибка запроса
          content: *id001
  /v1/jobs/{job_id}:

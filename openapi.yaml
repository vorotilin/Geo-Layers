components:
  schemas:
    AggregateRequest:
      properties:
        layers:
          type: string
          title: Layers
        bbox:
          anyOf:
          - items:
              type: number
            type: array
            maxItems: 4
            minItems: 4
          - type: 'null'
          title: Bbox
        geometry:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Geometry
      type: object
      required:
      - layers
      title: AggregateRequest
    BatchPoint:
      properties:
        id:
          type: string
          title: Id
        lat:
          type: number
          maximum: 90.0
          minimum: -90.0
          title: Lat
        lng:
          type: number
          maximum: 180.0
          minimum: -180.0
          title: Lng
      type: object
      required:
      - id
      - lat
      - lng
      title: BatchPoint
    BatchRequest:
      properties:
        points:
          items:
            $ref: '#/components/schemas/BatchPoint'
          type: array
          maxItems: 10000
          minItems: 1
          title: Points
        layers:
          type: string
          title: Layers
      type: object
      required:
      - points
      - layers
      title: BatchRequest
    Body_add_version_v1_point_sets__set_id__versions_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
        lon:
          type: string
          title: Lon
          default: lng
        lat:
          type: string
          title: Lat
          default: lat
        weight:
          anyOf:
          - type: string
          - type: 'null'
          title: Weight
        category:
          anyOf:
          - type: string
          - type: 'null'
          title: Category
      type: object
      required:
      - file
      title: Body_add_version_v1_point_sets__set_id__versions_post
    Body_create_point_set_v1_point_sets_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
        title:
          type: string
          title: Title
        lon:
          type: string
          title: Lon
          default: lng
        lat:
          type: string
          title: Lat
          default: lat
        weight:
          anyOf:
          - type: string
          - type: 'null'
          title: Weight
        category:
          anyOf:
          - type: string
          - type: 'null'
          title: Category
      type: object
      required:
      - file
      - title
      title: Body_create_point_set_v1_point_sets_post
    Body_import_polygons_v1_polygons_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
        provider:
          type: string
          title: Provider
        title:
          type: string
          title: Title
        period:
          type: string
          title: Period
        slug:
          type: string
          title: Slug
        key:
          type: string
          title: Key
          default: zone_id
        column:
          type: string
          title: Column
          default: val
        metric_title:
          type: string
          title: Metric Title
          default: ''
        unit:
          anyOf:
          - type: string
          - type: 'null'
          title: Unit
        value_kind:
          type: string
          title: Value Kind
          default: intensive
      type: object
      required:
      - file
      - provider
      - title
      - period
      - slug
      title: Body_import_polygons_v1_polygons_post
    Body_upload_file_v1_files_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - file
      title: Body_upload_file_v1_files_post
    BuildRequest:
      properties:
        point_set_id:
          type: string
          title: Point Set Id
        version_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Version Id
        method:
          type: string
          title: Method
          default: bin
        slug:
          type: string
          pattern: ^[a-z0-9][a-z0-9_]{0,62}$
          title: Slug
        title:
          type: string
          maxLength: 200
          minLength: 1
          title: Title
        unit:
          anyOf:
          - type: string
          - type: 'null'
          title: Unit
        grid_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Grid Id
        params:
          additionalProperties: true
          type: object
          title: Params
          default: {}
      type: object
      required:
      - point_set_id
      - slug
      - title
      title: BuildRequest
    CreateStyle:
      properties:
        name:
          type: string
          maxLength: 63
          minLength: 1
          title: Name
        spec:
          additionalProperties: true
          type: object
          title: Spec
      type: object
      required:
      - name
      - spec
      title: CreateStyle
    CreateToken:
      properties:
        title:
          type: string
          maxLength: 200
          minLength: 1
          title: Title
        scopes:
          items:
            type: string
          type: array
          maxItems: 3
          minItems: 1
          title: Scopes
      type: object
      required:
      - title
      - scopes
      title: CreateToken
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ImportRequest:
      properties:
        file_id:
          type: string
          title: File Id
        manifest:
          additionalProperties: true
          type: object
          title: Manifest
        callback_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Callback Url
      type: object
      required:
      - file_id
      - manifest
      title: ImportRequest
    SignRequest:
      properties:
        layer:
          type: string
          title: Layer
        version:
          anyOf:
          - type: string
          - type: 'null'
          title: Version
        style:
          type: string
          title: Style
          default: default
        tms:
          type: string
          enum:
          - '3857'
          - '3395'
          title: Tms
          default: '3857'
        ttl:
          anyOf:
          - type: integer
            maximum: 2592000.0
            minimum: 60.0
          - type: 'null'
          title: Ttl
      type: object
      required:
      - layer
      title: SignRequest
    UpdateStyle:
      properties:
        spec:
          additionalProperties: true
          type: object
          title: Spec
      type: object
      required:
      - spec
      title: UpdateStyle
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    WarmRequest:
      properties:
        layer_id:
          type: string
          title: Layer Id
        version_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Version Id
        tms:
          type: string
          enum:
          - '3857'
          - '3395'
          title: Tms
          default: '3857'
        bbox:
          items:
            type: number
          type: array
          maxItems: 4
          minItems: 4
          title: Bbox
        min_zoom:
          type: integer
          maximum: 22.0
          minimum: 0.0
          title: Min Zoom
        max_zoom:
          type: integer
          maximum: 22.0
          minimum: 0.0
          title: Max Zoom
        style:
          type: string
          title: Style
          default: default
      type: object
      required:
      - layer_id
      - bbox
      - min_zoom
      - max_zoom
      title: WarmRequest
    Error:
      type: object
      required:
      - error
      - message
      - details
      properties:
        error:
          type: string
          description: Машинный слаг, snake_case
          examples:
          - job_not_found
        message:
          type: string
          description: Текст для человека
          examples:
          - Задание не найдено
        details:
          type: object
  securitySchemes:
    bearer:
      type: http
      scheme: bearer

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: apc
      POSTGRES_PASSWORD: apc
      POSTGRES_DB: apc_layers
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apc -d apc_layers"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://apc:apc@db:5432/apc_layers
      REDIS_URL: redis://redis:6379/0
      APP_ENV: dev
      LOG_LEVEL: info
      HTTP_PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app

volumes:
  pgdata:
